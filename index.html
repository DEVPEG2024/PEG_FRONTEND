  <body>
    <noscript>Vous devez activer JavaScript pour exécuter cette application.</noscript>
    <div id="root">
      <!-- Repli affiché avant le montage de React (~6,5 s sur mobile 4G) :
           tout est inline, aucune requête réseau. React remplace le contenu
           de #root en montant, il n'y a donc rien à retirer à la main. -->
      <style>
        #peg-boot {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f1c2e;
        }
        #peg-boot svg {
          width: min(220px, 48vw);
          height: auto;
          opacity: 0.28;
          animation: peg-boot-pulse 1.8s ease-in-out infinite;
        }
        @keyframes peg-boot-pulse {
          0%, 100% { opacity: 0.16; }
          50% { opacity: 0.4; }
        }
        @media (prefers-reduced-motion: reduce) {
          #peg-boot svg { animation: none; opacity: 0.28; }
        }
      </style>
      <div id="peg-boot" aria-hidden="true">
        <!-- Logo PEG blanc (fond sombre), barre violette : public/img/logo/peg-logo-white.svg -->
        <svg viewBox="0 0 566.9 170.1" xmlns="http://www.w3.org/2000/svg" fill="#fff">

          <path d="M209.4,5.9h152.5v30.5h-152.5V5.9ZM209.4,127.9h152.5v30.5h-152.5v-30.5Z"/>
          <path d="M556.1,5.9h-105.6c-45.2,0-70.4,29.9-70.4,79.2s25.2,79.2,70.4,79.2h105.6v-75.1h-65.7v28.7h32.3v14.1h-70.4c-22.9,0-36.9-16.4-36.9-46.9s14.1-46.9,36.9-46.9h103.8V5.9Z"/>
          <rect fill="#7c2bff" x="216.7" y="65.1" width="137.8" height="28.2" rx="2.1" ry="2.1"/>
        </svg>
      </div>
    </div>
